<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema LPJeans — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="tela-login" id="telaLogin">

  <div class="marca-login-flutuante">
    <div class="texto-marca">LP JEANS</div>
    <div class="subtexto-marca">Moda Feminina</div>
  </div>

  <div class="frase-login-flutuante">
    <h2>Gestão inteligente para sua loja crescer.</h2>
    <p>Controle vendas, estoque, clientes e operações da LPJeans em um único sistema.</p>
  </div>

  <div class="login-caixa">
    <img src="img/logo.png" alt="LP Jeans" class="logo">
    <h1>Bem-vinda de volta</h1>
    <p class="boas-vindas">Entre com suas credenciais para acessar o sistema.</p>

    <form id="formLogin">
      <div class="campo campo-icone">
        <label for="login">Usuário</label>
        <svg class="icone-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="login" autocomplete="username" required>
      </div>

      <div class="campo campo-senha campo-icone">
        <label for="senha">Senha</label>
        <svg class="icone-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="4" y="10" width="16" height="10" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        <input type="password" id="senha" autocomplete="current-password" required>
        <button type="button" id="btnMostrarSenha" aria-label="Mostrar senha">
          <svg id="iconeOlhoAberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="iconeOlhoFechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.6 20.6 0 0 1 5.06-6.06M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 8 11 8a20.6 20.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="primario" id="btnEntrar">
        <span class="spinner-botao"></span>
        <span class="texto-botao">Entrar</span>
      </button>
    </form>

    <div id="msg" class="msg"></div>

    <div class="login-divisor"></div>

    <p class="login-rodape">
      <strong>Sistema LPJeans</strong>
      <span class="versao">Versão 2.0.0</span>
      <span class="marca-sistema">System by PH</span>
    </p>
  </div>

</div>

<script src="js/api.js"></script>
<script>
  const btnMostrar = document.getElementById('btnMostrarSenha');
  const campoSenha = document.getElementById('senha');
  const iconeAberto = document.getElementById('iconeOlhoAberto');
  const iconeFechado = document.getElementById('iconeOlhoFechado');
  const telaLogin = document.getElementById('telaLogin');
  const btnEntrar = document.getElementById('btnEntrar');

  btnMostrar.addEventListener('click', function () {
    const oculto = campoSenha.type === 'password';
    campoSenha.type = oculto ? 'text' : 'password';
    iconeAberto.style.display = oculto ? 'none' : 'block';
    iconeFechado.style.display = oculto ? 'block' : 'none';
  });

  document.getElementById('formLogin').addEventListener('submit', function (e) {
    e.preventDefault();

    const login = document.getElementById('login').value;
    const senha = document.getElementById('senha').value;
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    btnEntrar.classList.add('carregando');
    btnEntrar.disabled = true;

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: login, senha: senha }),
    })
      .then(function (resposta) {
        return resposta.json().then(function (dados) {
          return { ok: resposta.ok, dados: dados };
        });
      })
      .then(function (resultado) {
        if (!resultado.ok) {
          btnEntrar.classList.remove('carregando');
          btnEntrar.disabled = false;
          msg.textContent = resultado.dados.erro || 'Não foi possível entrar.';
          msg.className = 'msg erro';
          return;
        }
        sessionStorage.setItem('token', resultado.dados.token);
        telaLogin.classList.add('saindo');
        setTimeout(function () {
          window.location.href = '/dashboard.html';
        }, 280);
      })
      .catch(function () {
        btnEntrar.classList.remove('carregando');
        btnEntrar.disabled = false;
        msg.textContent = 'Não foi possível conectar ao servidor.';
        msg.className = 'msg erro';
      });
  });
</script>
</body>
</html>
