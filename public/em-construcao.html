<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Jeans — Em construção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <main class="conteudo">
    <div class="topo-pagina"><div><h1 id="tituloModulo">Módulo</h1><p>Ainda em construção</p></div></div>
    <div class="card">
      <div class="em-construcao">
        <div class="icone-grande">🛠️</div>
        <p>Este módulo ainda está sendo desenvolvido.</p>
        <p>Assim que estiver pronto, ele aparecerá aqui automaticamente.</p>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
  exigirLogin();
  const parametros = new URLSearchParams(window.location.search);
  const nomeModulo = parametros.get('modulo') || 'Módulo';
  document.getElementById('tituloModulo').textContent = nomeModulo;
  document.title = `LP Jeans — ${nomeModulo}`;
  const mapaIds = { 'Vendas': 'vendas', 'Compras': 'compras', 'Estoque': 'estoque', 'Clientes': 'clientes', 'Fornecedores': 'fornecedores', 'Caixa': 'caixa', 'Relatórios': 'relatorios', 'Usuários': 'usuarios', 'Configurações': 'configuracoes' };
  montarSidebar(mapaIds[nomeModulo] || '');
</script>
</body>
</html>
