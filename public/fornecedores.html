<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema LPJeans — Fornecedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <div class="coluna-principal">
    <div id="topbar-container"></div>
    <main class="conteudo">
      <div class="card">
        <h2>Novo fornecedor</h2>
        <form id="formFornecedor">
          <div class="campo"><label for="razaoSocial">Razão social *</label><input type="text" id="razaoSocial" required></div>
          <div class="campo"><label for="representante">Representante</label><input type="text" id="representante"></div>
          <div class="campo"><label for="telefone">Telefone</label><input type="text" id="telefone"></div>
          <div class="campo"><label for="cidade">Cidade</label><input type="text" id="cidade"></div>
          <div class="campo"><label for="estado">UF</label><input type="text" id="estado" maxlength="2" placeholder="Ex: PI"></div>
          <button type="submit" class="primario">Cadastrar fornecedor</button>
        </form>
        <div id="msgFornecedor" class="msg"></div>
      </div>

      <div class="card">
        <h2>Fornecedores cadastrados</h2>
        <form onsubmit="return false;" style="margin-bottom: 4px;">
          <div class="campo">
            <label for="busca">Buscar por razão social, representante ou telefone</label>
            <input type="text" id="busca" placeholder="Digite para buscar...">
          </div>
        </form>
        <div class="wrapper-tabela">
          <table>
            <thead><tr><th>Razão social</th><th>Representante</th><th>Telefone</th><th>Cidade/UF</th><th></th></tr></thead>
            <tbody id="tabelaFornecedores"><tr><td colspan="5">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/topbar.js"></script>
<script src="js/fornecedores.js"></script>
</body>
</html>
