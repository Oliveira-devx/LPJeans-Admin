<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema LPJeans — Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <div class="coluna-principal">
    <div id="topbar-container"></div>
    <main class="conteudo">

      <div class="card">
        <h2>Consultar estoque</h2>
        <div class="campo">
          <label for="busca">Buscar por produto, referência ou código de barras</label>
          <input type="text" id="busca" placeholder="Digite para buscar...">
        </div>
        <div class="wrapper-tabela">
          <table>
            <thead><tr><th>Produto</th><th>Tam.</th><th>Cor</th><th>Estoque atual</th><th>Mínimo</th><th></th></tr></thead>
            <tbody id="tabelaEstoque"><tr><td colspan="6">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="cardHistorico" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h2 id="tituloHistorico" style="margin:0;">Histórico</h2>
          <button class="secundario" onclick="fecharHistorico()">Fechar</button>
        </div>
        <div class="wrapper-tabela">
          <table>
            <thead><tr><th>Data</th><th>Tipo</th><th>Origem</th><th>Quantidade</th><th>Responsável</th><th>Observações</th></tr></thead>
            <tbody id="tabelaHistorico"></tbody>
          </table>
        </div>

        <h2 style="margin-top:20px;">Fazer ajuste manual</h2>
        <form id="formAjuste">
          <div class="campo" style="max-width:120px;"><label for="deltaAjuste">Quantidade (+/-)</label><input type="number" id="deltaAjuste" placeholder="Ex: -2 ou 5" required></div>
          <div class="campo"><label for="motivoAjuste">Motivo *</label><input type="text" id="motivoAjuste" placeholder="Ex: contagem física, peça avariada..." required></div>
          <button type="submit" class="primario">Registrar ajuste</button>
        </form>
        <div id="msgAjuste" class="msg"></div>
      </div>

    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/topbar.js"></script>
<script src="js/estoque.js"></script>
</body>
</html>
