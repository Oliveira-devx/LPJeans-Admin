<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Jeans — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <main class="conteudo">
    <div class="topo-pagina"><div><h1>Dashboard</h1><p>Visão geral da loja</p></div></div>
    <div class="grade-indicadores" id="indicadores"></div>
    <div class="card">
      <h2>Produtos com estoque baixo</h2>
      <table>
        <thead><tr><th>Produto</th><th>Tamanho</th><th>Cor</th><th>Estoque atual</th><th>Mínimo</th></tr></thead>
        <tbody id="tabelaEstoqueBaixo"><tr><td colspan="5">Carregando...</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Últimas vendas</h2>
      <div class="em-construcao" style="padding: 20px;">
        <p>O módulo de Vendas ainda está em construção. Assim que estiver pronto, as últimas vendas aparecerão aqui automaticamente.</p>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
