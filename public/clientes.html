<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema LPJeans — Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .lista-clientes {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px; margin-top: 4px;
  }
  .cliente-vazio { text-align: center; padding: 30px 10px; color: var(--texto-suave); font-size: 13.5px; grid-column: 1 / -1; }

  .cartao-cliente {
    border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px;
    background: var(--branco); animation: entrarLinha 0.2s ease-out both;
  }
  .cartao-cliente-nome { font-size: 14.5px; font-weight: 600; color: var(--texto); margin-bottom: 6px; }
  .cartao-cliente-linha {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--texto-suave); margin-bottom: 3px;
  }
  .cartao-cliente-linha svg { width: 13px; height: 13px; flex-shrink: 0; opacity: 0.7; }
  .cartao-cliente-rodape {
    display: flex; justify-content: flex-end; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--borda);
  }

  @media (max-width: 640px) {
    .lista-clientes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <div class="coluna-principal">
    <div id="topbar-container"></div>
    <main class="conteudo">
      <div class="card">
        <h2>Novo cliente</h2>
        <form id="formCliente">
          <div class="campo"><label for="nome">Nome *</label><input type="text" id="nome" required></div>
          <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" placeholder="Somente números" maxlength="14"></div>
          <div class="campo"><label for="telefone">Telefone</label><input type="text" id="telefone"></div>
          <div class="campo"><label for="email">E-mail</label><input type="email" id="email"></div>
          <div class="campo"><label for="instagram">Instagram</label><input type="text" id="instagram" placeholder="@usuario"></div>
          <div class="campo"><label for="dataNascimento">Nascimento</label><input type="date" id="dataNascimento"></div>
          <div class="campo"><label for="cidade">Cidade</label><input type="text" id="cidade"></div>
          <button type="submit" class="primario">Cadastrar cliente</button>
        </form>
        <div id="msgCliente" class="msg"></div>
      </div>

      <div class="card">
        <h2>Clientes cadastrados</h2>
        <form onsubmit="return false;" style="margin-bottom: 4px;">
          <div class="campo">
            <label for="busca">Buscar por nome, CPF ou telefone</label>
            <input type="text" id="busca" placeholder="Digite para buscar...">
          </div>
        </form>
        <div id="tabelaClientes" class="lista-clientes">
          <div class="cliente-vazio">Carregando...</div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/topbar.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
