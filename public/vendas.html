<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema LPJeans — Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .card-busca { position: sticky; top: 60px; z-index: 15; margin-bottom: 14px; }
  .campo-busca-grande { position: relative; }
  .campo-busca-grande svg.icone-lupa {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--texto-suave); pointer-events: none;
  }
  .campo-busca-grande input {
    width: 100%; height: 50px; padding: 0 16px 0 42px; border-radius: 12px;
    font-size: 15.5px; border: 2px solid var(--borda);
  }
  .campo-busca-grande input:focus { border-color: var(--primario); }

  .resultado-busca {
    border: 1px solid var(--borda); border-radius: 12px; margin-top: 8px;
    max-height: 320px; overflow-y: auto; background: var(--branco);
    box-shadow: var(--sombra-media);
  }
  .resultado-busca .linha-produto { padding: 10px 14px 3px; font-size: 12px; color: var(--texto-suave); font-weight: 600; border-top: 1px solid var(--borda); }
  .resultado-busca .linha-produto:first-child { border-top: none; }
  .resultado-busca .linha-variacao {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; cursor: pointer; font-size: 14px;
    transition: background 0.1s ease;
  }
  .resultado-busca .linha-variacao:active { background: var(--primario-claro); }
  .resultado-busca .linha-variacao:hover { background: var(--creme); }
  .resultado-busca .linha-variacao.sem-estoque { opacity: 0.4; cursor: not-allowed; }

  .lista-carrinho { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .carrinho-vazio { text-align: center; padding: 36px 10px; color: var(--texto-suave); font-size: 13.5px; }
  .carrinho-vazio svg { width: 30px; height: 30px; margin-bottom: 8px; opacity: 0.5; }

  .item-carrinho {
    border: 1px solid var(--borda); border-left: 3px solid var(--primario);
    border-radius: 10px; padding: 12px 14px;
    background: var(--branco); animation: entrarLinha 0.2s ease-out both;
  }
  .item-carrinho-info { display: flex; flex-direction: column; gap: 1px; margin-bottom: 10px; }
  .item-carrinho-produto { font-size: 13.5px; font-weight: 600; color: var(--texto); }
  .item-carrinho-variacao { font-size: 12px; color: var(--texto-suave); }

  .item-carrinho-controles {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px;
  }

  .carrinho-qtd { display: flex; align-items: center; gap: 6px; }
  .carrinho-qtd button {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: var(--gradiente); cursor: pointer; font-size: 18px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  .carrinho-qtd button:active { transform: scale(0.92); filter: brightness(0.95); }
  .carrinho-qtd input {
    width: 36px; text-align: center; padding: 6px 2px; font-size: 15px; font-weight: 700;
    border: 1px solid var(--borda); border-radius: 8px; background: var(--creme);
  }

  .item-carrinho-preco { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .item-carrinho-preco label { font-size: 10px; color: var(--texto-suave); font-weight: 500; }
  .item-carrinho-preco input {
    width: 84px; text-align: right; padding: 7px 8px; font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--borda); border-radius: 8px;
  }
  .item-carrinho-preco input:focus { border-color: var(--primario); outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }

  .item-carrinho-rodape {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 8px; border-top: 1px solid var(--borda);
  }
  .item-carrinho-subtotal { font-size: 14px; font-weight: 700; color: var(--texto); }

  .botao-remover-item {
    width: 30px; height: 30px; border-radius: 8px; border: none;
    background: var(--vermelho-fundo); color: var(--vermelho); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .botao-remover-item svg { width: 15px; height: 15px; }

  .resumo-total { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; }
  .resumo-total.final { font-size: 18px; font-weight: 700; color: var(--texto); border-top: 1px solid var(--borda); margin-top: 6px; padding-top: 12px; }
  .linha-pagamento { display: flex; gap: 10px; align-items: end; margin-bottom: 8px; }

  .barra-total-fixa { display: none; }

  @media (max-width: 780px) {
    .conteudo { padding-bottom: 96px; }
    .card-busca { top: 0; }
    .barra-total-fixa {
      display: flex; align-items: center; justify-content: space-between;
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40;
      background: var(--gradiente); color: #fff; border-radius: 16px;
      padding: 14px 18px; box-shadow: 0 12px 32px rgba(30, 27, 75, 0.35);
      cursor: pointer; border: none; width: calc(100% - 24px);
    }
    .barra-total-fixa .qtd-itens { font-size: 12px; opacity: 0.85; }
    .barra-total-fixa .valor-total { font-size: 18px; font-weight: 700; }
    .barra-total-fixa .acao { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
    .barra-total-fixa svg { width: 18px; height: 18px; }
    #btnAbrirPagamento { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar-container"></div>
  <div class="coluna-principal">
    <div id="topbar-container"></div>
    <main class="conteudo">

      <div id="painelInicio">
        <div class="card">
          <h2>Iniciar nova venda</h2>
          <form id="formNovaVenda">
            <div class="campo"><label for="clienteVenda">Cliente (opcional)</label><select id="clienteVenda"><option value="">Sem cliente identificado</option></select></div>
            <div class="campo"><label for="funcionarioVenda">Vendedor(a) *</label><select id="funcionarioVenda" required></select></div>
            <button type="submit" class="primario" style="padding:12px 24px; font-size:15px;">Iniciar venda</button>
          </form>
        </div>

        <div class="card">
          <h2>Vendas em aberto</h2>
          <div class="wrapper-tabela">
            <table>
              <thead><tr><th>Cliente</th><th>Vendedor(a)</th><th>Iniciada em</th><th></th></tr></thead>
              <tbody id="tabelaVendasAbertas"><tr><td colspan="4">Carregando...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="painelVenda" style="display:none;">

        <div class="card card-busca">
          <div class="campo-busca-grande">
            <svg class="icone-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
            <input type="text" id="buscaProduto" placeholder="Buscar produto por nome ou referência..." autocomplete="off">
          </div>
          <div id="resultadoBusca" class="resultado-busca" style="display:none;"></div>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h2 style="margin:0;">Itens da venda</h2>
            <button class="secundario" onclick="cancelarVendaAtual()">Cancelar venda</button>
          </div>

          <div id="tabelaCarrinho" class="lista-carrinho">
            <div class="carrinho-vazio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              <div>Carrinho vazio — busque um produto acima.</div>
            </div>
          </div>

          <div style="max-width:280px; margin-left:auto; margin-top:16px;">
            <div class="resumo-total"><span>Subtotal</span><span id="resumoSubtotal">R$ 0,00</span></div>
            <div class="resumo-total">
              <span>Desconto geral</span>
              <input type="number" id="descontoGeral" min="0" step="0.01" value="0" style="width:100px; text-align:right;">
            </div>
            <div class="resumo-total final"><span>Total</span><span id="resumoFinal">R$ 0,00</span></div>
          </div>

          <button class="primario" id="btnAbrirPagamento" style="width:100%; padding:14px; font-size:16px; margin-top:16px;">
            Finalizar venda
          </button>
        </div>

        <div class="card" id="cardPagamento" style="display:none;">
          <h2>Pagamento</h2>
          <div id="linhasPagamento"></div>
          <button class="secundario" onclick="adicionarLinhaPagamento()">+ Adicionar forma de pagamento</button>
          <div class="resumo-total" style="margin-top:14px;"><span>Restante a pagar</span><strong id="restantePagar">R$ 0,00</strong></div>
          <button class="primario" id="btnConfirmarPagamento" style="width:100%; padding:14px; font-size:16px; margin-top:12px;">
            Confirmar e finalizar
          </button>
          <div id="msgFinalizacao" class="msg"></div>
        </div>

        <button class="barra-total-fixa" id="barraTotalFixa">
          <span>
            <span class="qtd-itens" id="barraQtdItens">0 itens</span><br>
            <span class="valor-total" id="barraValorTotal">R$ 0,00</span>
          </span>
          <span class="acao">
            Finalizar
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
        </button>

      </div>

    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/topbar.js"></script>
<script src="js/vendas.js"></script>
<script>
  const barraFixa = document.getElementById('barraTotalFixa');
  if (barraFixa) {
    barraFixa.addEventListener('click', () => {
      document.getElementById('btnAbrirPagamento').click();
    });
  }

  const observadorTotal = new MutationObserver(() => {
    const total = document.getElementById('resumoFinal')?.textContent || 'R$ 0,00';
    const qtdItens = document.querySelectorAll('#tabelaCarrinho .item-carrinho').length;
    const elQtd = document.getElementById('barraQtdItens');
    const elValor = document.getElementById('barraValorTotal');
    if (elQtd) elQtd.textContent = qtdItens === 1 ? '1 item' : `${qtdItens} itens`;
    if (elValor) elValor.textContent = total;
  });
  const alvoObservado = document.getElementById('resumoFinal');
  if (alvoObservado) observadorTotal.observe(alvoObservado, { childList: true, characterData: true, subtree: true });
</script>
</body>
</html>
