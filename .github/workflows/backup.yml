      - name: Testar autenticação PostgreSQL
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGPORT: ${{ secrets.DB_PORT }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGDATABASE: ${{ secrets.DB_NAME }}
        run: |
          echo "Host configurado: ${PGHOST:+SIM}"
          echo "Porta configurada: ${PGPORT:+SIM}"
          echo "Usuário configurado: ${PGUSER:+SIM}"
          echo "Banco configurado: ${PGDATABASE:+SIM}"
          echo "Senha configurada: ${PGPASSWORD:+SIM}"

          psql -c "SELECT current_user, current_database();"
