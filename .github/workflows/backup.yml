      - name: Gerar o dump do banco
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGPORT: ${{ secrets.DB_PORT }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGDATABASE: ${{ secrets.DB_NAME }}
        run: |
          echo "Verificando configuração de conexão..."

          test -n "$PGHOST" || { echo "ERRO: DB_HOST não foi configurado"; exit 1; }
          test -n "$PGPORT" || { echo "ERRO: DB_PORT não foi configurado"; exit 1; }
          test -n "$PGUSER" || { echo "ERRO: DB_USER não foi configurado"; exit 1; }
          test -n "$PGPASSWORD" || { echo "ERRO: DB_PASSWORD não foi configurado"; exit 1; }
          test -n "$PGDATABASE" || { echo "ERRO: DB_NAME não foi configurado"; exit 1; }

          pg_dump \
            --no-owner \
            --no-privileges \
            --file=backup-$(date +%Y-%m-%d).sql